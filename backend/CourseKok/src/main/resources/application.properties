spring.application.name=CourseKok
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=application-secret.properties


#tourapi.service-key=bc1a81e6ad5d5d769b32a7fbe58a0899394d83620bf8e8eaac82b4c5b3638a2c
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# JWT
jwt.secret=${JWT_SECRET:coursekok-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000
