spring.application.name=CourseKok
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:application-secret.properties


app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# JWT
jwt.secret=${JWT_SECRET:coursekok-dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=1209600000

# GMS OpenAI API
gms.api.url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions
gms.api.key=${GMS_KEY:dummy-key-for-dev}

# Kakao Mobility
kakaomobility.rest-api-key=${KAKAO_REST_API_KEY}
